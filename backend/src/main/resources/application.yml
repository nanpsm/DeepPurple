spring:
  application:
    name: deeppurple-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/deeppurple}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

aws:
  region: ${AWS_REGION:us-east-1}
  lambda:
    function-arn: ${LAMBDA_FUNCTION_ARN:arn:aws:lambda:us-east-1:000000000000:function:deeppurple-analyze}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
